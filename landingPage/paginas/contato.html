<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davi Calote | Home</title>
    <link rel="shortcut icon" href="../imagens/icone.png" type="image/png">
    <link rel="stylesheet" href="../estilos/estilo.css">
</head>
<body>
    <header class="topo">
        <div class="container barra">
            <a class="logo" href="../index.html">Davi Calote Pereira</a>
            <nav class="menu">
                 <a href="../index.html">Menu</a>
                <a href="../paginas/curriculo.html">Currículo</a>
                <a href="../paginas/github.html">GitHub</a>
                <a href="../paginas/servicos.html">Serviços</a>
                <a href="../paginas/contato.html" class="ativo">Contato</a>
            </nav>
        </div>
    </header>

    <main class="container"> 
        <h1>Contato</h1>
        <p>Preencha o formulário e eu envio a proposta</p>

        <form action="#" method="post">

      <fieldset>
        <legend>Seus dados</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(27) 99999-9999">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <p><strong>Você é:</strong></p>
        <input type="radio" id="pf" name="pessoa" value="fisica" checked>
        <label class="inline" for="pf">Pessoa física</label>
        <input type="radio" id="pj" name="pessoa" value="juridica">
        <label class="inline" for="pj">Pessoa jurídica</label>
      </fieldset>

      <fieldset>
        <legend>Sobre o projeto</legend>

        <label for="horario">Melhor horário para contato</label>
        <select id="horario" name="horario">
          <option value="manha">Manhã</option>
          <option value="tarde">Tarde</option>
          <option value="noite">Noite</option>
        </select>

        <p><strong>Tipo de serviço:</strong></p>
        <input type="checkbox" id="estatico" name="servico" value="estatico">
        <label class="inline" for="estatico">Site estático</label>
        <input type="checkbox" id="dinamico" name="servico" value="dinamico">
        <label class="inline" for="dinamico">Site dinâmico</label>
        <input type="checkbox" id="avancado" name="servico" value="avancado">
        <label class="inline" for="avancado">Site avançado</label>

        <label for="descricao">Descreva o que deseja contratar</label>
        <textarea id="descricao" name="descricao" rows="5"></textarea>
      </fieldset>

      <button class="botao" type="submit">Enviar pedido</button>
    </form>
    </main>

    <footer class="rodape">
        <div class="container">
            <p>&copy; 2026 Davi Calote Pereira. Trabalho de Desenvolvimento Web</p>
            <p><a href="../index.html" style="color: #f2b134;">Votlar ao início</a></p>
        </div>
    </footer>
</body>
</html>
